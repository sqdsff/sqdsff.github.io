<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>假聊天界面</title>
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .phone {
      width: 375px;
      height: 667px;
      border: 1px solid #ccc;
      border-radius: 30px;
      overflow: hidden;
      background-image: url('image1.png');
      background-size: cover;
      background-position: center;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
    }

    /* 页眉 固定在顶部 */
    .header {
      flex: none;
      z-index: 3; /* 覆盖消息区 */
    }
    .header img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 可滚动消息区：从页眉下方到页脚上方 */
    .content {
      flex: 1 1 auto;
      overflow-y: auto; /* 要求使用 overflow-y:auto */
      -webkit-overflow-scrolling: touch;
      z-index: 2;
      background: transparent; /* 覆盖在背景图上 */
    }
    .messages img {
      /* display: block; */
      width: 100%; /* 左右宽度一样，平铺满 */
      height: auto;
    }

    /* 消息图片初始隐藏（图片2..9） */
    .msg {
      display: none;
    }

    /* 页脚 固定在底部 */
    .footer {
      flex: none;
      z-index: 3;
    }
    .footer img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 确保所有图片覆盖在背景之上 */
    .header, .content, .footer {
      position: relative;
    }

    /* 视觉辅助：去掉滚动条在窄屏的突兀，可按需调整 */
    .content::-webkit-scrollbar { width: 8px; }
    .content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  </style>
</head>
<body>
  <div class="phone" role="application" aria-label="假聊天界面">
    <!-- 页眉：图片0 -->
    <div class="header">
      <img src="image0.png" alt="header" />
    </div>

    <!-- 可滚动区域：图片2..9 按顺序显示，覆盖在图片1（背景）上 -->
    <div class="content">
      <div class="messages">
        <img class="msg" src="image2.png" alt="msg2" />
        <img class="msg" src="image3.png" alt="msg3" />
        <img class="msg" src="image4.png" alt="msg4" />
        <img class="msg" src="image5.png" alt="msg5" />
        <img class="msg" src="image6.png" alt="msg6" />
        <img class="msg" src="image7.png" alt="msg7" />
        <img class="msg" src="image8.png" alt="msg8" />
        <img class="msg" src="image9.png" alt="msg9" />
      </div>
    </div>

    <!-- 页脚：图片10 -->
    <div class="footer">
      <img src="image10.png" alt="footer" />
    </div>
  </div>

  <script>
    // 图片2..9 放入数组 a，初始隐藏，2秒顺序显示
    (function () {
      const a = Array.from(document.querySelectorAll('.messages .msg'));
      let idx = 0;
      const timer = setInterval(() => {
        if (idx >= a.length) {
          clearInterval(timer);
          return;
        }
        a[idx].style.display = 'block';
        idx++;
      }, 1000);
    })();
  </script>
</body>
</html>
