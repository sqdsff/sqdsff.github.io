<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>假聊天界面</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f0f0;
    }
    .phone {
      width: 375px;
      height: 667px;
      border: 1px solid #ccc;
      border-radius: 30px;
      overflow: hidden;
      background-image: url('image1.png');
      background-size: cover;
      background-position: center;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
    }
    .header {
      flex: 0 0 auto;
    }
    .header img {
      display: block;
      width: 100%;
      height: auto;
    }
    .scroll-area {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      background: transparent;    }
    .scroll-inner {
      width: 100%;
    }
    .scroll-inner img {
      display: block;
      width: 100%;
      height: auto;
    }
    .hidden {
      display: none !important;
    }
    .footer {
      flex: 0 0 auto;
    }
    .footer img {
      display: block;
      width: 100%;
      height: auto;
    }
    .popup {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <img src="image0.png" alt="页眉">
    </div>
    <div class="scroll-area">
      <div class="scroll-inner">
        <img src="image2.png" alt="布局图片2">
        <img id="img3" src="image3.png" alt="图片3" class="hidden">
        <img id="img4" src="image4.png" alt="图片4" class="hidden">
        <img id="img5" src="image5.png" alt="图片5" class="hidden popup">
      </div>
    </div>
    <div class="footer">
      <img src="image6.png" alt="页脚">
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var img3 = document.getElementById('img3');
      var img4 = document.getElementById('img4');
      var img5 = document.getElementById('img5');

      setTimeout(function () {
        img3.classList.remove('hidden');
      }, 5000);

      img3.addEventListener('click', function () {
        img3.classList.add('hidden');
        img4.classList.remove('hidden');
      });

      img4.addEventListener('click', function () {
        if (img5.classList.contains('hidden')) {
          img5.classList.remove('hidden');
          img5.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    });
  </script>
</body>
</html>
